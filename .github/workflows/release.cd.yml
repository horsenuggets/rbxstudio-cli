name: Release / CD

on:
  push:
    branches:
      - release

jobs:
  build-cli:
    name: build-cli-${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - linux-x86_64
          - linux-aarch64
          - macos-x86_64
          - macos-aarch64
          - windows-x86_64
          - windows-aarch64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Rokit
        uses: CompeyDev/setup-rokit@v0.1.2

      - name: Install dependencies
        run: wally install

      - name: Build executable
        run: ./Scripts/BuildExecutable.exec.luau ${{ matrix.target }}

      # Rokit extracts an archive and looks for a binary named after the tool, so
      # every release asset is a zip containing "rbxstudio" or "rbxstudio.exe".
      - name: Package archive
        run: |
          mkdir -p Build/package
          if [[ "${{ matrix.target }}" == windows-* ]]; then
            cp Build/rbxstudio.exe Build/package/rbxstudio.exe
          else
            cp Build/rbxstudio Build/package/rbxstudio
            chmod +x Build/package/rbxstudio
          fi
          cd Build/package
          zip -r "../rbxstudio-${{ matrix.target }}.zip" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rbxstudio-${{ matrix.target }}
          path: Build/rbxstudio-${{ matrix.target }}.zip

  create-release:
    name: create-release
    runs-on: ubuntu-latest
    needs: [build-cli]
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Get version and changelog
        id: version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$VERSION" >> $GITHUB_OUTPUT

          CHANGELOG=$(awk -v ver="$VERSION" '
            /^## / {
              if (found) exit
              if ($2 == ver) found=1
              next
            }
            found { print }
          ' CHANGELOG.md | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' | sed '/^$/N;/^\n$/d')

          echo "$CHANGELOG" > /tmp/changelog.txt

      - name: Create git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.version.outputs.tag }}
          git push origin ${{ steps.version.outputs.tag }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ steps.version.outputs.tag }} \
            --title "${{ steps.version.outputs.tag }}" \
            --notes-file /tmp/changelog.txt \
            artifacts/rbxstudio-*/*
